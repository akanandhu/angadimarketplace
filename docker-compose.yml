services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: angadi
      POSTGRES_PASSWORD: angadi
      POSTGRES_DB: angadi
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'

volumes:
  pgdata:
